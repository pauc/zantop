# Kamal deployment for the Rails 8.1 app. Run `kamal docs` for the reference.
#
# The image is built and pushed by .github/workflows/deploy.yml, never on the
# droplet: an esbuild + sass + sprockets build does not fit in the RAM of the
# box we are deploying to.

service: zantop
image: pauc/zantop

servers:
  web:
    - <%= ENV.fetch("ZANTOP_DEPLOY_HOST", "REPLACE_ME_WITH_THE_NEW_DROPLET_IP") %>

# Kamal defaults to root, which is what a fresh DigitalOcean droplet gives you.
# ssh:
#   user: deployer

proxy:
  # kamal-proxy requests a Let's Encrypt certificate for the hosts below and
  # renews it itself. There is no certbot, no cron entry and no certificate file
  # anywhere in this repository — which is the point, since the legacy site's
  # ZeroSSL certificate expired in January because renewing it was something a
  # person had to remember.
  ssl: true
  # Overridable so the provisional-domain rehearsal in docs/cutover-runbook.md
  # can deploy under a hostname of its own. Every host named here is one
  # kamal-proxy will attempt an ACME challenge for, and a challenge for a name
  # that does not resolve to this droplet is a *failed validation*, not a
  # skipped one — Let's Encrypt rate-limits those per hour. So the rehearsal
  # replaces this list rather than adding to it, and the real hosts come back
  # only once DNS points here.
  #
  # Blank counts as unset, which ENV.fetch would not do: a GitHub Actions
  # `${{ vars.X }}` for an undefined variable expands to an empty string, and
  # `"".split(",")` is `[]` — an empty hosts list, so kamal-proxy requests no
  # certificate at all and serves plain HTTP without erroring. Guarding here
  # rather than in the workflow covers `export ZANTOP_PROXY_HOSTS=` from a
  # shell too, and keeps one copy of the default.
  hosts: <%= (ENV["ZANTOP_PROXY_HOSTS"].to_s.strip.empty? ? "mireiazantop.com,www.mireiazantop.com" : ENV["ZANTOP_PROXY_HOSTS"]).split(",").map(&:strip).reject(&:empty?).inspect %>
  # The route added in config/routes.rb. kamal-proxy will not send traffic to a
  # new container until this answers 200, and it answers over plain HTTP
  # because config.assume_ssl makes Rails treat proxied requests as secure
  # rather than redirecting them.
  healthcheck:
    path: /up
    interval: 3
    timeout: 30

registry:
  server: ghcr.io
  username: pauc
  # A GitHub personal access token with write:packages, not the account
  # password. In CI this is the workflow's GITHUB_TOKEN.
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Reuses the layer cache across builds, which matters because the gem and
  # node_modules layers dominate the build. Registry rather than gha so that a
  # deploy run by hand from a laptop hits the same cache as CI; the gha backend
  # only exists inside a workflow run. The cache lands in
  # ghcr.io/pauc/zantop-build-cache.
  cache:
    type: registry
    options: mode=max

env:
  clear:
    # The Postgres accessory below, reachable by container name on the kamal
    # network. config/database.yml reads all four of these.
    ZANTOP_DATABASE_HOST: zantop-db
    ZANTOP_DATABASE_PORT: 5432
    ZANTOP_DATABASE_USER: zantop
    # Matches the volume mount below. Without it ActiveStorage would write
    # inside the container and lose every upload on the next deploy.
    ZANTOP_STORAGE_ROOT: /data/uploads
    # Submission port and HELO domain for the contact form's SMTP delivery.
    # Neither is account-specific, so they are literals rather than secrets;
    # config/environments/production.rb defaults to these same two values.
    ZANTOP_SMTP_PORT: 587
    ZANTOP_SMTP_DOMAIN: mireiazantop.com
    # "true" only for the provisional-domain rehearsal, which puts the whole
    # portfolio on a publicly resolving hostname; it makes every response carry
    # X-Robots-Tag: noindex. Defaulting to "false" here rather than leaving it
    # unset means the real deploy cannot inherit a stale "true" from whoever
    # last ran the rehearsal from their shell.
    ZANTOP_NOINDEX: "<%= ENV.fetch("ZANTOP_NOINDEX", "false") %>"
  secret:
    - ZANTOP_DATABASE_PASSWORD
    # The mail account the contact form sends through. The host is not
    # sensitive in itself, but it names the provider and belongs with the
    # credentials that authenticate against it rather than in a committed file.
    - ZANTOP_SMTP_ADDRESS
    - ZANTOP_SMTP_USER_NAME
    - ZANTOP_SMTP_PASSWORD
    # Not RAILS_MASTER_KEY: the key for config/credentials/production.yml.enc
    # was never recoverable, and with the database credentials moved to the
    # environment secret_key_base was the only thing left inside it. Since main
    # has never been deployed, nothing was signed with the old value.
    - SECRET_KEY_BASE

# Uploaded files live on the host, not in the image.
volumes:
  - "/var/lib/zantop/uploads:/data/uploads"

# Keeps the previous release's fingerprinted assets reachable, so a page served
# just before a deploy does not 404 on its CSS just after one.
asset_path: /rails/public/assets

# The default 30s is tight: the entrypoint runs db:prepare before Puma binds.
deploy_timeout: 60

accessories:
  db:
    image: postgres:18.4-alpine
    host: <%= ENV.fetch("ZANTOP_DEPLOY_HOST", "REPLACE_ME_WITH_THE_NEW_DROPLET_IP") %>
    # Bound to loopback only: the app reaches it over the kamal Docker network
    # by name, and this is purely so psql and pg_dump work from an SSH session
    # during the cutover.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: zantop
      secret:
        - POSTGRES_PASSWORD
    directories:
      # postgres:18 images keep PGDATA under /var/lib/postgresql, not
      # .../data — same as docker-compose.yml.
      - data:/var/lib/postgresql

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  dbc: accessory exec db --interactive --reuse "psql -U zantop zantop_production"

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("ZANTOP_DATABASE_HOST") { "localhost" } %>
  username: <%= ENV["ZANTOP_DATABASE_USER"] %>
  password: <%= ENV["ZANTOP_DATABASE_PASSWORD"] %>
  port: <%= ENV.fetch("ZANTOP_DATABASE_PORT") { 5432 } %>

development: &development
  <<: *default
  database: <%= ENV.fetch("ZANTOP_DATABASE_NAME") { "zantop" } %>_development
  username: <%= ENV.fetch("ZANTOP_DATABASE_USER") { "zantop" } %>
  password: <%= ENV.fetch("ZANTOP_DATABASE_PASSWORD") { "zantop" } %>
  port: <%= ENV.fetch("ZANTOP_DATABASE_PORT") { 5445 } %>

test:
  <<: *development
  database: <%= ENV.fetch("ZANTOP_DATABASE_NAME") { "zantop" } %>_test

# The credentials come from ZANTOP_DATABASE_USER/PASSWORD in *default, which
# Kamal injects from .kamal/secrets. Reading them out of the encrypted
# credentials instead would mean shipping the master key into the image build,
# since this file is ERB-evaluated at boot and so during assets:precompile.
# It would also duplicate the password the Postgres accessory is created with.
production:
  <<: *default
  database: zantop_production

name: Run tests

on:
  # branch pushes are covered by their pull request; limiting push to main
  # avoids running everything twice once a PR is open
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rspec-test:
    name: RSpec
    runs-on: ubuntu-latest
    env:
      ZANTOP_DATABASE_USER: postgres
      ZANTOP_DATABASE_PASSWORD: postgres
      ZANTOP_DATABASE_PORT: 5432
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        # tmpfs makes DB faster by using RAM
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7
      # no ruby-version: setup-ruby reads .tool-versions, and bundler-cache
      # installs the bundler from Gemfile.lock and runs a cached bundle install
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Create database
        run: bundle exec rails db:test:prepare --trace
      - name: Run tests
        run: bundle exec rake

---

services:
  db:
    container_name: zantop_db
    image: "postgres:18.4-alpine"
    environment:
      - POSTGRES_USER=zantop
      - POSTGRES_PASSWORD=zantop
    volumes:
      # postgres:18 images keep PGDATA under /var/lib/postgresql (not .../data)
      - database_files:/var/lib/postgresql
    ports:
      - "5445:5432"

networks:
  default:
    name: zantop_default

volumes:
  database_files:
